<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com" />
    <title>Life</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main>
      <div class="mark"><span>spa</span></div>
      <h1>Connect to your Life server</h1>
      <p>Your dashboard, data and agent live on your server. Enter its address.</p>
      <form id="form">
        <input id="server" name="server" placeholder="http://203.0.113.5:8810" autocomplete="url" spellcheck="false" autofocus />
        <div class="error" id="error"></div>
        <div class="row"><button class="filled" type="submit" id="go">Connect</button></div>
      </form>
      <p>Running Life on this Mac? Use <code>http://127.0.0.1:8810</code></p>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
